name: Ruby

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Quoted so YAML doesn't parse versions like '4.0' as numbers
        ruby: ['3.3', '3.4', '4.0', head]
        color: ['~> 1.8', '~> 2.0']

    runs-on: ubuntu-latest

    env:
      COLOR_VERSION: ${{ matrix.color }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          rubygems: latest
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake
